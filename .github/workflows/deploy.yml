name: Deploy Blobular

on:
  workflow_dispatch:

concurrency:
  group: deploy-blobular-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # config.php is managed on the host; never upload or delete it during sync.
      - name: Remove host-managed config from deployment files
        run: rm -f dist/api/config.php dist/api/config.php.* dist/api/config.php~ dist/api/.config.php*

      - name: Deploy dist to FTPS /blobular/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          security: strict
          log-level: minimal
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_BLOBULAR_SERVER_DIR || '/blobular/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/config.php*
            **/.config.php*
