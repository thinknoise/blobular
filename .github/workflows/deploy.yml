name: Deploy Blobular

on:
  workflow_dispatch:

concurrency:
  group: deploy-blobular-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Write PHP config from secrets
        env:
          BLOBULAR_DB_HOST: ${{ secrets.BLOBULAR_DB_HOST }}
          BLOBULAR_DB_NAME: ${{ secrets.BLOBULAR_DB_NAME }}
          BLOBULAR_DB_USER: ${{ secrets.BLOBULAR_DB_USER }}
          BLOBULAR_DB_PASS: ${{ secrets.BLOBULAR_DB_PASS }}
          BLOBULAR_USERS_TABLE: ${{ secrets.BLOBULAR_USERS_TABLE }}
          BLOBULAR_CLOUD_TEST_ACCOUNT_IDS: ${{ secrets.BLOBULAR_CLOUD_TEST_ACCOUNT_IDS }}
          BLOBULAR_S3_ACCESS_KEY_ID: ${{ secrets.BLOBULAR_S3_ACCESS_KEY_ID }}
          BLOBULAR_S3_SECRET_ACCESS_KEY: ${{ secrets.BLOBULAR_S3_SECRET_ACCESS_KEY }}
          BLOBULAR_S3_SESSION_TOKEN: ${{ secrets.BLOBULAR_S3_SESSION_TOKEN }}
        run: node scripts/write-php-config.mjs

      - name: Deploy dist to FTPS /blobular/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          security: strict
          log-level: minimal
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_BLOBULAR_SERVER_DIR || '/blobular/' }}
